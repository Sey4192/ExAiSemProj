# Render blueprint for hosting the EXAI backend that the Tymeout app calls.
# The model is retrained at build time from the fixed-seed simulation, so it
# matches the committed results exactly.
services:
  - type: web
    name: tymeout-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python ml/generate_data.py && python ml/train_model.py
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
